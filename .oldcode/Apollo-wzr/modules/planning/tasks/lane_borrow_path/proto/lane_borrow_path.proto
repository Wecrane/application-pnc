syntax = "proto2";

import "modules/planning/planning_base/proto/piecewise_jerk_path_config.proto";

package apollo.planning;

message LaneBorrowPathConfig {
  optional PiecewiseJerkPathConfig path_optimizer_config = 1;
  optional bool is_allow_lane_borrowing = 2 [default = true];
  // The max speed of adc condition triggering lane borrow 
  optional double lane_borrow_max_speed = 3 [default = 5.0];
  // Determine if the obstacle is long-term parking
  optional int64 long_term_blocking_obstacle_cycle_threshold =4 [default = 3];
  // Construction-zone reverse target distance in meters.
  optional double reverse_distance = 5 [default = 8.0];
  // Exit reverse when remaining distance to the fixed reverse target is below this threshold.
  optional double reverse_target_remain_threshold = 6 [default = 0.7];
  // Gate construction-zone logic to straight-road sections.
  optional bool enable_construction_curvature_gate = 7 [default = true];
  // Forward distance used to check whether the road is straight enough for construction-zone mode.
  optional double construction_straight_check_distance = 8 [default = 35.0];
  // Sampling step for construction straight-road curvature check.
  optional double construction_straight_check_delta_s = 9 [default = 2.0];
  // Maximum absolute reference-line curvature allowed for construction-zone mode.
  optional double construction_straight_max_abs_kappa = 10 [default = 0.01];
}
