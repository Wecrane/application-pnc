--flagfile=/apollo/modules/common/data/global_flagfile.txt
--traffic_rule_config_filename=/apollo/modules/planning/planning_component/conf/traffic_rule_config.pb.txt
# ⚠️ 评分铁律 [1.5,5.1]：planning_upper_speed_limit 千万别调高（>5.1 越界整次判 0）；原 5.0 距上限 5.1 仅 0.1，稳版降至 4.5（巡航目标 2.5 远低于此，仅作加速天花板，无行为影响）
--planning_upper_speed_limit=4.5
# 原 5.0 → 2.5（评分 cruise ≤3.0556；3.0 实测速度峰值 3.14-3.16 会超速；2.5 距上限 0.5556，扣控制超调 0.16 仍剩 ~0.4 裕量）
--default_cruise_speed=2.5
--ignore_overlapped_obstacle=true
--prioritize_change_lane
--min_length_for_lane_change=5.0
--nouse_multi_thread_to_add_obstacles
--enable_print_curve=false
--destination_check_distance=20.0
--smoother_config_filename=/apollo/modules/planning/planning_component/conf/discrete_points_smoother_config.pb.txt
--enable_reference_line_stitching=false
--export_chart=false
--longitudinal_jerk_lower_bound=-5
--longitudinal_jerk_upper_bound=5
--obstacle_lat_buffer=0.4
# 🔴 第八轮复审新增（停车题命门）：原 0.0 → 0.8。实车横穿行人被感知为 UNKNOWN
# → crosswalk 规则类型检查失败从不建 STOP（expand 再大也无用）→ 停车靠 speed_decider
# 兜底（static/cross 分支对所有类型阻塞障碍物都 STOP，停行人前 N 米）。
# 实测停车 0.26~0.62m（=感知行人距横道近边）→ 0.8 后停车=1.06~1.42m ∈[1.0,1.5] ✓
# ⚠️ 不能 1.25（0.26+1.25=1.51 超上限）；0.8 覆盖 0.26~0.62 全达标（裕量 0.06~0.08）
# 副作用：静态障碍物/跟车 too_close 停 0.8m 前（更安全），限速题无关
--min_stop_distance_obstacle=0.8
--max_stop_distance_obstacle=0.0
--static_obstacle_nudge_l_buffer=0.6
--enable_smoother_failsafe
--enable_parallel_trajectory_smoothing=true
--use_s_curve_speed_smooth
--use_iterative_anchoring_smoother=true
--speed_fallback_distance=0.0
--nonstatic_obstacle_nudge_l_buffer=0.15
--use_st_drivable_boundary=false
--enable_pull_over_at_destination=false
--replan_time_threshold=7.0
--obstacle_lon_start_buffer=0.4
--check_collision_freespace_obstacle_vertices=false
--yield_distance=1.0
--passed_destination_threshold=0.5
--open_space_delta_t=0.2
--open_space_acc_weight=1.0
--open_space_jerk_weight=10.0
--open_space_kappa_weight=100.0
--open_space_reference_s_weight=10.0
--open_space_reference_v_weight=10.0
--open_space_max_forward_v=2.0
--open_space_max_reverse_v=2.0
--open_space_max_forward_acc=1.0
--open_space_max_reverse_acc=0.3
--open_space_max_jerk=2.0
--enable_reference_line_provider_thread=false
--enable_smooth_reference_line=true
--enable_corner_constraint=true
--speed_optimize_fail_relax_velocity_constraint=false
--path_bounds_horizon=12.0

--longitudinal_acceleration_lower_bound=-2.0
--longitudinal_acceleration_upper_bound=2.0
--smoother_stop_distance=10
--passed_referenceline_end_threshold=5
